name: Frontend verification

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "global.json"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "global.json"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use the pinned npm release
        run: npm install --global npm@12.2.2
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund
      - name: Lint and typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Install Chromium and browser dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Build and start the isolated browser-test stack
        run: docker compose -p admissions-e2e -f docker-compose.yml -f docker-compose.e2e.yml up --build --wait --wait-timeout 180 frontend
      - name: Verify frontend behavior and accessibility
        working-directory: frontend
        run: npx --no-install playwright test
      - name: Verify real UI, API and PostgreSQL admission flows
        working-directory: frontend
        run: npx --no-install playwright test --config=playwright.live.config.ts
      - name: Show isolated service logs on failure
        if: failure()
        run: docker compose -p admissions-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color frontend backend migrate db
      - name: Remove only the disposable browser-test project and its database
        if: always()
        run: docker compose -p admissions-e2e -f docker-compose.yml -f docker-compose.e2e.yml down --volumes --remove-orphans
